    // ─── REVIEWS ────────────────────────────────────────────────────────────
    function Reviews() {
      const [active, setActive]   = useState(0);
      const [visible, setVisible] = useState(true);
      const activeRef = useRef(0);

      const goTo = (idx) => {
        const next = ((idx % REVIEWS.length) + REVIEWS.length) % REVIEWS.length;
        setVisible(false);
        setTimeout(() => {
          setActive(next);
          activeRef.current = next;
          setVisible(true);
        }, 220);

      useEffect(() => {
        const id = setInterval(() => goTo(activeRef.current + 1), 6000);
        return () => clearInterval(id);
      }, []);

      const r = REVIEWS[active];

          fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 13,
          letterSpacing: "0.1em", textTransform: "uppercase",
          transition: "all 0.2s",

                <div className="label">Customer reviews</div>

                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 16 }}>

                  <span style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 15, color: "var(--white)" }}>5.0</span>
                  <span style={{ fontSize: 13, color: "var(--muted)" }}>· 16 Google reviews</span>
                </div>
              </div>
              <a href="https://g.page/r/CfvN8xEx2wVYEAE/review" target="_blank" rel="noreferrer"

              background: "var(--dark)",
              border: "1px solid var(--border)",

              position: "relative",
              minHeight: 260,
              opacity: visible ? 1 : 0,
              transition: "opacity 0.22s ease",

              <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 3, background: "var(--orange)" }} />

              <div style={{
                fontFamily: "Georgia, serif", fontSize: 96,
                color: "var(--border)", lineHeight: 1,
                marginBottom: 8, userSelect: "none",

              <div style={{ display: "flex", gap: 3, marginBottom: 20 }}>

                  <span key={j} style={{ color: "var(--orange)", fontSize: 20 }}>★</span>

              </div>

              <p style={{

              <div style={{

                <div style={{

                <div>
                  <div style={{ fontWeight: 500, fontSize: 15 }}>{r.name}</div>

                </div>
                <div style={{ marginLeft: "auto", fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 13, color: "var(--muted)", letterSpacing: "0.08em" }}>

                  <div className="label" style={{ marginBottom: 20 }}>Contact &amp; Location</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
                    <div>
                      <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 4, letterSpacing: "0.1em", textTransform: "uppercase" }}>Phone</div>
                      <a href={`tel:${PHONE.replace(/\D/g, "")}`} style={{ color: "var(--orange)", fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 22, textDecoration: "none" }}>{PHONE}</a>
                    </div>
                    <div>
                      <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 4, letterSpacing: "0.1em", textTransform: "uppercase" }}>Address</div>
                      <div style={{ fontSize: 15, color: "var(--light)" }}>{ADDRESS}</div>
                    </div>
                    <div>
                      <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 12, letterSpacing: "0.1em", textTransform: "uppercase" }}>Hours</div>
                      {HOURS.map(h => (
                        <div key={h.day} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid var(--border)", fontSize: 14 }}>
                          <span style={{ color: "var(--light)" }}>{h.day}</span>
                          <span style={{ color: h.time === "Closed" ? "var(--muted)" : "var(--white)", fontWeight: 500 }}>{h.time}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div style={{ background: "var(--orange)", padding: "28px 28px" }}>
                  <div style={{ fontFamily: "var(--font-display)", fontWeight: 900, fontSize: 20, textTransform: "uppercase", marginBottom: 8 }}>
                    Urgent Issue?
                  </div>
                  <p style={{ fontSize: 14, marginBottom: 20, opacity: 0.9, lineHeight: 1.6 }}>
                    If the vehicle is unsafe to drive, don't use the form. Call us directly.
                  </p>
                  <a href={`tel:${PHONE.replace(/\D/g, "")}`} style={{
                    display: "block", textAlign: "center",
                    background: "#fff", color: "var(--orange)",
                    fontFamily: "var(--font-display)", fontWeight: 800,
                    fontSize: 16, letterSpacing: "0.08em", textTransform: "uppercase",
                    padding: "14px 20px", textDecoration: "none",
                  }}>
                    📞 Call Now
                  </a>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ─── FOOTER ─────────────────────────────────────────────────────────────
    function Footer() {
      const SocialIcon = ({ href, label, path }) => (
        <a href={href} target="_blank" rel="noreferrer" aria-label={label} style={{
          width: 36, height: 36,
          background: "var(--mid)",
          border: "1px solid var(--border)",
          display: "flex", alignItems: "center", justifyContent: "center",
          color: "var(--light)", textDecoration: "none",
          transition: "all 0.2s",
        }}
          onMouseEnter={e => { e.currentTarget.style.background = "var(--orange)"; e.currentTarget.style.borderColor = "var(--orange)"; e.currentTarget.style.color = "#fff"; }}
          onMouseLeave={e => { e.currentTarget.style.background = "var(--mid)"; e.currentTarget.style.borderColor = "var(--border)"; e.currentTarget.style.color = "var(--light)"; }}
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
            {path}
          </svg>
        </a>
      );

      return (
        <footer id="contact" style={{ background: "var(--dark)", borderTop: "1px solid var(--border)" }}>
          {/* Top nav/contact bar */}
          <div style={{ borderBottom: "1px solid var(--border)", padding: "56px 24px" }}>
            <div className="footer-top-grid" style={{
              maxWidth: 1200, margin: "0 auto",
              display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 56,
            }}>
              {/* Brand + social */}
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                  <div style={{ width: 36, height: 36, background: "var(--orange)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <span style={{ fontFamily: "var(--font-display)", fontWeight: 900, fontSize: 14, color: "#fff" }}>RW</span>
                  </div>
                  <span style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 18, letterSpacing: "0.08em", textTransform: "uppercase" }}>
                    Revworks Automotive
                  </span>
                </div>
                <p style={{ fontSize: 14, color: "var(--muted)", lineHeight: 1.7, maxWidth: 320, marginBottom: 24 }}>
                  Honest automotive repair in Mississauga. 15+ years of experience,
                  5,000+ vehicles serviced, and work you can see before you approve it.
                </p>
                <div style={{ display: "flex", gap: 8 }}>
                  <SocialIcon href="#" label="Instagram" path={
                    <>
                      <rect x="2" y="2" width="20" height="20" rx="5"/>
                      <circle cx="12" cy="12" r="4"/>
                      <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/>
                    </>
                  }/>
                  <SocialIcon href="#" label="Facebook" path={
                    <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/>
                  }/>
                  <SocialIcon href="https://g.page/r/CfvN8xEx2wVYEAE/review" label="Google" path={
                    <>
                      <path d="M12 12h8a8 8 0 11-2.4-5.6"/>
                      <path d="M12 12l4 4"/>
                    </>
                  }/>
                </div>
              </div>

              {/* Nav links */}
              <div>
                <div className="label" style={{ marginBottom: 20 }}>Navigate</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {[
                    ["Services", "#services"],
                    ["About", "#about"],
                    ["Reviews", "#reviews"],
                    ["Book Diagnostic", "#book"],
                    ["Contact", "#contact"],
                  ].map(([label, href]) => (
                    <a key={label} href={href} style={{
                      fontSize: 14, color: "var(--muted)", textDecoration: "none",
                      fontFamily: "var(--font-display)", fontWeight: 700,
                      letterSpacing: "0.06em", textTransform: "uppercase",
                      transition: "color 0.2s",
                    }}
                      onMouseEnter={e => e.target.style.color = "var(--white)"}
                      onMouseLeave={e => e.target.style.color = "var(--muted)"}
                    >{label}</a>
                  ))}
                </div>
              </div>

              {/* Contact quick-access */}
              <div>
                <div className="label" style={{ marginBottom: 20 }}>Contact</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                  <div>
                    <div style={{ fontSize: 11, color: "var(--muted)", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 6, fontFamily: "var(--font-display)", fontWeight: 700 }}>Phone</div>
                    <a href={`tel:${PHONE.replace(/\D/g, "")}`} style={{ fontSize: 16, color: "var(--orange)", fontFamily: "var(--font-display)", fontWeight: 700, textDecoration: "none" }}>{PHONE}</a>
                  </div>
                  <div>
                    <div style={{ fontSize: 11, color: "var(--muted)", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 6, fontFamily: "var(--font-display)", fontWeight: 700 }}>Address</div>
                    <div style={{ fontSize: 14, color: "var(--light)", lineHeight: 1.6 }}>{ADDRESS}</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 11, color: "var(--muted)", letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 8, fontFamily: "var(--font-display)", fontWeight: 700 }}>Hours</div>
                    {HOURS.map(h => (
                      <div key={h.day} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid var(--border)", fontSize: 13 }}>
                        <span style={{ color: "var(--muted)" }}>{h.day}</span>
                        <span style={{ color: h.time === "Closed" ? "var(--border)" : "var(--light)", fontWeight: 500 }}>{h.time}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* CTA + Map */}
          <div className="section">
            <div className="footer-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 64, marginBottom: 64 }}>
              <div>
                <div className="label" style={{ marginBottom: 20 }}>Local shop. Easy next step.</div>
                <h2 className="h2" style={{ fontSize: 42, marginBottom: 20 }}>
                  Ready to sort out the issue?
                </h2>
                <p style={{ color: "var(--light)", fontSize: 16, lineHeight: 1.75, fontWeight: 300, marginBottom: 32 }}>
                  Call, request a time, or use directions to find the shop in Mississauga.
                  If the vehicle is unsafe to drive, call before bringing it in.
                </p>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <a href="#book" className="btn-primary">Request an Appointment →</a>
                  <a href={`tel:${PHONE.replace(/\D/g, "")}`} className="btn-ghost">Call {PHONE}</a>
                </div>
              </div>

              <div>
                <div style={{ border: "1px solid var(--border)", overflow: "hidden", lineHeight: 0 }}>
                  <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6958.122417743781!2d-79.66554469573205!3d43.684492976401316!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x882b3f45dc47b881%3A0x5805cbd311f3cdfb!2sREVWORKS%20AUTOMOTIVE!5e0!3m2!1sen!2sca!4v1777916097425!5m2!1sen!2sca"
                    width="100%" height="280"
                    style={{ border: 0, display: "block", filter: "grayscale(1) invert(0.9) contrast(0.85)" }}
                    allowFullScreen=""
                    loading="lazy"
                    referrerPolicy="no-referrer-when-downgrade"
                  />
                </div>
              </div>
            </div>

            <div style={{
              paddingTop: 32, borderTop: "1px solid var(--border)",
              display: "flex", justifyContent: "space-between", alignItems: "center",
              flexWrap: "wrap", gap: 16,
            }}>
              <div style={{ fontSize: 13, color: "var(--muted)" }}>
                © {new Date().getFullYear()} Revworks Automotive · Mississauga, ON ·{" "}
                <a href="/privacy" style={{ color: "var(--muted)" }}>Privacy</a>
              </div>
              <div style={{ display: "flex", gap: 24 }}>
                {[["Services", "#services"], ["About", "#about"], ["Book", "#book"]].map(([label, href]) => (
                  <a key={label} href={href} style={{ fontSize: 12, color: "var(--border)", textDecoration: "none", fontFamily: "var(--font-display)", fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>{label}</a>
                ))}
              </div>
            </div>
          </div>
        </footer>
      );
    }

    // ─── MOBILE STICKY BAR ──────────────────────────────────────────────────
    function MobileStickyBar() {
      return (
        <div style={{
          position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 200,
          display: "grid", gridTemplateColumns: "1fr 1fr 1fr",
          gap: 1, background: "var(--border)",
        }} className="mobile-sticky">
          {[
            { label: "📞 Call",       href: `tel:${PHONE.replace(/\D/g, "")}` },
            { label: "📅 Book",       href: "#book" },
            { label: "🗺 Directions", href: `https://maps.google.com/?q=${encodeURIComponent(ADDRESS)}` },
          ].map(item => (
            <a key={item.label} href={item.href}
              style={{
                display: "flex", alignItems: "center", justifyContent: "center",
                background: "var(--dark)",
                fontFamily: "var(--font-display)", fontWeight: 700,
                fontSize: 13, letterSpacing: "0.08em", textTransform: "uppercase",
                color: "var(--white)", textDecoration: "none",
                padding: "16px 8px",
              }}
            >{item.label}</a>
          ))}
        </div>
      );
    }

    // ─── APP ────────────────────────────────────────────────────────────────
    function RevworksHomepage() {
      return (
        <>
          <style dangerouslySetInnerHTML={{ __html: globalStyles + responsiveStyles }} />
          <Nav />
          <Hero />
          <TrustBar />
          <Services />
          <About />
          <Reviews />
          <Process />
          <BookingForm />
          <Footer />
          <MobileStickyBar />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RevworksHomepage />);
  </script>
</body>
</html>
