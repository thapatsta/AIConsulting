    function Process() {
      return (
        <section style={{ background: "var(--dark)", borderTop: "1px solid var(--border)" }}>
          <div className="section">
            <div className="label">How it works</div>
            <h2 className="h2" style={{ marginBottom: 56 }}>How booking works.</h2>

            <div className="process-grid" style={{
              display: "grid",
              gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))",
              gap: 1,
              background: "var(--border)",
              border: "1px solid var(--border)",
            }}>
              {PROCESS.map((step, i) => (
                <div key={i} style={{ background: "var(--dark)", padding: "40px 32px" }}>
                  <div style={{
                    fontFamily: "var(--font-display)", fontWeight: 900,
                    fontSize: 56, color: "var(--border)",
                    lineHeight: 1, marginBottom: 20,
                  }}>{step.n}</div>
                  <div className="h3" style={{ marginBottom: 10, fontSize: 17 }}>{step.title}</div>
                  <p style={{ fontSize: 14, color: "var(--light)", lineHeight: 1.65, fontWeight: 300 }}>{step.desc}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // ─── BOOKING FORM ───────────────────────────────────────────────────────
    function BookingForm() {
      const [form, setForm] = useState({
        firstName: "", lastName: "", phone: "", email: "",
        year: "", make: "", model: "",
        service: "", issue: "", preferredDay: "", timeWindow: "", driveable: "",
      });
      const [submitted, setSubmitted] = useState(false);

      const update = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const inputStyle = {
        width: "100%",
        background: "var(--mid)",
        border: "1px solid var(--border)",
        color: "var(--white)",
        fontFamily: "var(--font-body)",
        fontSize: 15,
        padding: "14px 16px",
        outline: "none",
        transition: "border-color 0.2s",
      };

      const labelStyle = {
        fontFamily: "var(--font-display)",
        fontSize: 11, fontWeight: 700,
        letterSpacing: "0.15em",
        textTransform: "uppercase",
        color: "var(--light)",
        display: "block", marginBottom: 8,
      };

      const focusOrange = e => e.target.style.borderColor = "var(--orange)";
      const blurBorder  = e => e.target.style.borderColor = "var(--border)";

      if (submitted) {
        return (
          <section id="book" style={{ background: "var(--black)", borderTop: "1px solid var(--border)" }}>
            <div className="section" style={{ textAlign: "center", padding: "120px 24px" }}>
              <div style={{
                width: 64, height: 64,
                background: "var(--orange)",
                display: "flex", alignItems: "center", justifyContent: "center",
                margin: "0 auto 32px",
                fontSize: 28,
              }}>✓</div>
              <h2 className="h2" style={{ marginBottom: 16 }}>Request Received.</h2>
              <p style={{ color: "var(--light)", fontSize: 17, maxWidth: 440, margin: "0 auto 32px", fontWeight: 300 }}>
                A team member will review your request and reach out to confirm the next step.
                This is not a confirmed appointment yet.
              </p>
              <p style={{ color: "var(--muted)", fontSize: 14, marginBottom: 40 }}>
                If the vehicle is unsafe to drive, call us now:{" "}
                <a href={`tel:${PHONE.replace(/\D/g, "")}`} style={{ color: "var(--orange)" }}>{PHONE}</a>
              </p>
              <button className="btn-ghost" onClick={() => setSubmitted(false)}>Submit Another Request</button>
            </div>
          </section>
        );
      }

      return (
        <section id="book" style={{ background: "var(--black)", borderTop: "1px solid var(--border)" }}>
          <div className="section">
            <div className="label">Get in touch</div>
            <h2 className="h2" style={{ marginBottom: 12 }}>Request an Appointment.</h2>
            <p style={{ color: "var(--light)", fontSize: 16, maxWidth: 480, marginBottom: 48, fontWeight: 300 }}>
              Tell us what's going on with the vehicle and your preferred timing.
              We'll review the request and confirm the right next step.
            </p>

            <div className="form-layout" style={{
              display: "grid",
              gridTemplateColumns: "1fr 1fr",
              gap: 40,
              alignItems: "start",
            }}>
              {/* Form */}
              <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>

                <div className="form-two-col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                  <div>
                    <label style={labelStyle}>First Name *</label>
                    <input style={inputStyle} value={form.firstName}
                      onChange={e => update("firstName", e.target.value)}
                      onFocus={focusOrange} onBlur={blurBorder}
                    />
                  </div>
                  <div>
                    <label style={labelStyle}>Last Name *</label>
                    <input style={inputStyle} value={form.lastName}
                      onChange={e => update("lastName", e.target.value)}
                      onFocus={focusOrange} onBlur={blurBorder}
                    />
                  </div>
                </div>

                <div className="form-two-col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                  <div>
                    <label style={labelStyle}>Phone *</label>
                    <input style={inputStyle} type="tel" value={form.phone}
                      onChange={e => update("phone", e.target.value)}
                      onFocus={focusOrange} onBlur={blurBorder}
                    />
                  </div>
                  <div>
                    <label style={labelStyle}>Email</label>
                    <input style={inputStyle} type="email" value={form.email}
                      onChange={e => update("email", e.target.value)}
                      onFocus={focusOrange} onBlur={blurBorder}
                    />
                  </div>
                </div>

                <div className="form-three-col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16 }}>
                  {[["Year *", "year", "2018"], ["Make *", "make", "Honda"], ["Model *", "model", "Civic"]].map(([l, k, ph]) => (
                    <div key={k}>
                      <label style={labelStyle}>{l}</label>
                      <input style={inputStyle} placeholder={ph} value={form[k]}
                        onChange={e => update(k, e.target.value)}
                        onFocus={focusOrange} onBlur={blurBorder}
                      />
                    </div>
                  ))}
                </div>

                <div>
                  <label style={labelStyle}>Service Needed *</label>
                  <select style={{ ...inputStyle, appearance: "none" }}
                    value={form.service} onChange={e => update("service", e.target.value)}
                    onFocus={focusOrange} onBlur={blurBorder}
                  >
                    <option value="">Select a service…</option>
                    {["Diagnostics", "Oil Change", "Brakes", "A/C & Heating", "Suspension", "Inspection", "Other"].map(s =>
                      <option key={s} value={s}>{s}</option>
                    )}
                  </select>
                </div>

                <div>
                  <label style={labelStyle}>Describe the Issue *</label>
                  <textarea style={{ ...inputStyle, resize: "vertical", minHeight: 96 }}
                    value={form.issue} onChange={e => update("issue", e.target.value)}
                    placeholder="What is the vehicle doing? When does it happen?"
                    onFocus={focusOrange} onBlur={blurBorder}
                  />
                </div>

                <div className="form-two-col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                  <div>
                    <label style={labelStyle}>Preferred Day *</label>
                    <input style={inputStyle} type="date" value={form.preferredDay}
                      onChange={e => update("preferredDay", e.target.value)}
                      onFocus={focusOrange} onBlur={blurBorder}
                    />
                  </div>
                  <div>
                    <label style={labelStyle}>Time Window *</label>
                    <select style={{ ...inputStyle, appearance: "none" }}
                      value={form.timeWindow} onChange={e => update("timeWindow", e.target.value)}
                      onFocus={focusOrange} onBlur={blurBorder}
                    >
                      <option value="">Select…</option>
                      {["Morning", "Midday", "Afternoon", "Flexible"].map(t =>
                        <option key={t} value={t}>{t}</option>
                      )}
                    </select>
                  </div>
                </div>

                <div>
                  <label style={labelStyle}>Is the Vehicle Safe to Drive? *</label>
                  <div style={{ display: "flex", gap: 12 }}>
                    {["Yes", "No", "Unsure"].map(opt => (
                      <button key={opt} type="button"
                        onClick={() => update("driveable", opt)}
                        style={{
                          flex: 1, padding: "12px 8px",
                          background: form.driveable === opt ? "var(--orange)" : "var(--mid)",
                          border: "1px solid",
                          borderColor: form.driveable === opt ? "var(--orange)" : "var(--border)",
                          color: "var(--white)",
                          fontFamily: "var(--font-display)",
                          fontWeight: 700, fontSize: 13,
                          letterSpacing: "0.1em", textTransform: "uppercase",
                          cursor: "pointer", transition: "all 0.2s",
                        }}
                      >{opt}</button>
                    ))}
                  </div>
                </div>

                <div style={{
                  background: "var(--mid)", border: "1px solid var(--border)",
                  padding: "16px 18px", fontSize: 13, color: "var(--muted)", lineHeight: 1.6,
                }}>
                  ⚠ Submitting this form does <strong style={{ color: "var(--light)" }}>not</strong> confirm an appointment.
                  We'll review your request and reply to confirm.
                  <br /><br />
                  If the vehicle is unsafe to drive, overheating, leaking fluids, or has brake/steering issues,{" "}
                  <a href={`tel:${PHONE.replace(/\D/g, "")}`} style={{ color: "var(--orange)" }}>call us now at {PHONE}</a>.
                </div>

                <button
                  className="btn-primary"
                  style={{ width: "100%", justifyContent: "center", fontSize: 15, padding: "18px" }}
                  onClick={() => {
                    if (form.firstName && form.phone && form.year && form.make && form.model && form.issue) {
                      setSubmitted(true);
                      window.scrollTo({ top: 0, behavior: "smooth" });
                    }
                  }}
                >
                  Submit Request →
                </button>
              </div>

              {/* Sidebar */}
              <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
                <div style={{ background: "var(--dark)", border: "1px solid var(--border)", padding: "32px 28px" }}>
                  <div className="label" style={{ marginBottom: 20 }}>Contact &amp; Location</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
                    <div>
                      <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 4, letterSpacing: "0.1em", textTransform: "uppercase" }}>Phone</div>
                      <a href={`tel:${PHONE.replace(/\D/g, "")}`} style={{ color: "var(--orange)", fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 22, textDecoration: "none" }}>{PHONE}</a>
                    </div>
                    <div>
                      <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 4, letterSpacing: "0.1em", textTransform: "uppercase" }}>Address</div>
                      <div style={{ fontSize: 15, color: "var(--light)" }}>{ADDRESS}</div>
                    </div>
                    <div>
                      <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 12, letterSpacing: "0.1em", textTransform: "uppercase" }}>Hours</div>
                      {HOURS.map(h => (
                        <div key={h.day} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid var(--border)", fontSize: 14 }}>
                          <span style={{ color: "var(--light)" }}>{h.day}</span>
                          <span style={{ color: h.time === "Closed" ? "var(--muted)" : "var(--white)", fontWeight: 500 }}>{h.time}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div style={{ background: "var(--orange)", padding: "28px 28px" }}>
                  <div style={{ fontFamily: "var(--font-display)", fontWeight: 900, fontSize: 20, textTransform: "uppercase", marginBottom: 8 }}>
                    Urgent Issue?
                  </div>
                  <p style={{ fontSize: 14, marginBottom: 20, opacity: 0.9, lineHeight: 1.6 }}>
                    If the vehicle is unsafe to drive, don't use the form. Call us directly.
                  </p>
                  <a href={`tel:${PHONE.replace(/\D/g, "")}`} style={{
                    display: "block", textAlign: "center",
                    background: "#fff", color: "var(--orange)",
                    fontFamily: "var(--font-display)", fontWeight: 800,
                    fontSize: 16, letterSpacing: "0.08em", textTransform: "uppercase",
                    padding: "14px 20px", textDecoration: "none",
                  }}>
                    📞 Call Now
                  </a>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ─── FOOTER ─────────────────────────────────────────────────────────────
    function Footer() {
      return (
        <footer id="contact" style={{ background: "var(--dark)", borderTop: "1px solid var(--border)" }}>
          <div className="section">
            <div className="footer-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 64, marginBottom: 64 }}>
              <div>
                <div className="label" style={{ marginBottom: 20 }}>Local shop. Easy next step.</div>
                <h2 className="h2" style={{ fontSize: 42, marginBottom: 20 }}>
                  Ready to sort out the issue?
                </h2>
                <p style={{ color: "var(--light)", fontSize: 16, lineHeight: 1.75, fontWeight: 300, marginBottom: 32 }}>
                  Call, request a time, or use directions to find the shop in Mississauga.
                  If the vehicle is unsafe to drive, call before bringing it in.
                </p>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  <a href="#book" className="btn-primary">Request an Appointment →</a>
                  <a href={`tel:${PHONE.replace(/\D/g, "")}`} className="btn-ghost">Call {PHONE}</a>
                </div>
              </div>

              <div>
                <div style={{
                  background: "var(--mid)", border: "1px solid var(--border)",
                  height: 240, display: "flex", flexDirection: "column",
                  alignItems: "center", justifyContent: "center",
                  gap: 12,
                }}>
                  <div style={{ fontSize: 32 }}>📍</div>
                  <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 16, letterSpacing: "0.05em", textAlign: "center", padding: "0 20px" }}>
                    {ADDRESS}
                  </div>
                  <a href={`https://maps.google.com/?q=${encodeURIComponent(ADDRESS)}`}
                    target="_blank" rel="noreferrer"
                    className="btn-ghost" style={{ fontSize: 12, padding: "8px 16px" }}>
                    Get Directions →
                  </a>
                  <p style={{ fontSize: 11, color: "var(--muted)" }}>Replace with Google Maps embed</p>
                </div>
              </div>
            </div>

            <div style={{
              paddingTop: 32, borderTop: "1px solid var(--border)",
              display: "flex", justifyContent: "space-between", alignItems: "center",
              flexWrap: "wrap", gap: 16,
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{
                  width: 28, height: 28, background: "var(--orange)",
                  display: "flex", alignItems: "center", justifyContent: "center",
                }}>
                  <span style={{ fontFamily: "var(--font-display)", fontWeight: 900, fontSize: 12, color: "#fff" }}>RW</span>
                </div>
                <span style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 15, letterSpacing: "0.08em", textTransform: "uppercase" }}>
                  Revworks Automotive
                </span>
              </div>
              <div style={{ fontSize: 13, color: "var(--muted)" }}>
                © {new Date().getFullYear()} Revworks Automotive · Mississauga, ON ·{" "}
                <a href="/privacy" style={{ color: "var(--muted)" }}>Privacy</a>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    // ─── MOBILE STICKY BAR ──────────────────────────────────────────────────
    function MobileStickyBar() {
      return (
        <div style={{
          position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 200,
          display: "grid", gridTemplateColumns: "1fr 1fr 1fr",
          gap: 1, background: "var(--border)",
        }} className="mobile-sticky">
          {[
            { label: "📞 Call",        href: `tel:${PHONE.replace(/\D/g, "")}` },
            { label: "📅 Book",        href: "#book" },
            { label: "🗺 Directions",  href: `https://maps.google.com/?q=${encodeURIComponent(ADDRESS)}` },
          ].map(item => (
            <a key={item.label} href={item.href}
              style={{
                display: "flex", alignItems: "center", justifyContent: "center",
                background: "var(--dark)",
                fontFamily: "var(--font-display)", fontWeight: 700,
                fontSize: 13, letterSpacing: "0.08em", textTransform: "uppercase",
                color: "var(--white)", textDecoration: "none",
                padding: "16px 8px",
              }}
            >{item.label}</a>
          ))}
        </div>
      );
    }

    // ─── APP ────────────────────────────────────────────────────────────────
    function RevworksHomepage() {
      return (
        <>
          <style dangerouslySetInnerHTML={{ __html: globalStyles + responsiveStyles }} />
          <Nav />
          <Hero />
          <TrustBar />
          <Services />
          <About />
          <Reviews />
          <Process />
          <BookingForm />
          <Footer />
          <MobileStickyBar />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<RevworksHomepage />);
  </script>
</body>
</html>
